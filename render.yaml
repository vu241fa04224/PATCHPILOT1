services:
  - type: web
    name: patchpilot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python seed_data.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: USE_SQLITE
        value: "true"
      - key: SQLITE_DB_PATH
        value: patchpilot.db

  - type: web
    name: patchpilot-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://patchpilot-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
